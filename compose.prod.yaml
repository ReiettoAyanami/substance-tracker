# Production stack: app (API that also serves the Angular build) + an optional MySQL.
#   docker compose -f compose.prod.yaml up -d
# Secrets come only from .env (gitignored); the stack refuses to start without them.
# The database: the db service below while .env has COMPOSE_PROFILES=db (the default of
# .env.example), or any MySQL 8 of one's own through DB_HOST / DB_PORT (then no COMPOSE_PROFILES).
# NEVER "down -v" here: it deletes the database volume.

name: substance-tracker-prod

services:
  db:
    # Only with COMPOSE_PROFILES=db in .env. It creates DB_NAME and DB_USER on its first start.
    profiles: ["db"]
    image: mysql:8.4
    restart: unless-stopped
    environment:
      # Not checked here (":?" would demand it with a MySQL of one's own too): unset, this
      # container stops at its first start with "password option is not specified".
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: ${DB_NAME:-substance_tracker}
      MYSQL_USER: ${DB_USER:-substance}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  app:
    # The image the CI publishes from main (README, "Releases"): APP_VERSION picks one (a26.0.0.0001,
    # v26.1.0.0000...), unset it is the last release. `docker compose pull` fetches it; while no image is
    # published, `docker compose up -d --build` builds it here from the Dockerfile.
    image: ghcr.io/reiettoayanami/substance-tracker:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # The MySQL to use: the db service unless .env names another server. A new installation
      # creates DB_NAME there at its first start (when DB_USER may), then its tables.
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-substance_tracker}
      DB_USER: ${DB_USER:-substance}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      PORT: "3000"
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Sign-in (design-accounts.md, "Identity"): the address the instance is opened at, the secret
      # that signs the session cookies, and the header the instance's proxy (if any) sets to the
      # client's IP.
      APP_URL: ${APP_URL:?APP_URL must be set in .env - the address the instance is opened at}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in .env - openssl rand -base64 32}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      # The first administrator: created at the first start, its password written to
      # to_delete.password.txt next to this file (delete it after reading). admin unless .env says
      # otherwise (lenzi, 2026-10-03). The username is permanent: it is the address of the
      # administrator's pages (/admin, its admin panel /admin/admin).
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.invalid}
      FIRST_ADMIN_PASSWORD_FILE: /project/to_delete.password.txt
      # WEB_DIST=/app/public is set in the Dockerfile.
    volumes:
      # This folder, for the first administrator's password file only. Known risk (design-accounts.md,
      # "first account"): a compromised app could rewrite the files here; a narrower mount fixes it.
      - .:/project
    ports:
      - "${APP_PORT:-8080}:3000"
    healthcheck:
      # The runtime image has no curl: Node 22's fetch hits /api/health.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      # Waited for when it is part of the stack (COMPOSE_PROFILES=db); with a MySQL of one's own
      # the app retries the connection for about a minute.
      db:
        condition: service_healthy
        required: false

volumes:
  db-data:
