<mat-dialog-content>
  @if (chooser) {
    <mat-form-field appearance="outline" class="kind">
      <mat-label>New</mat-label>
      <mat-select class="kind-select" [value]="kind()" (selectionChange)="kind.set($event.value)">
        @for (option of data.kinds; track option) {
          <mat-option [value]="option">{{ labels[option] }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  }

  @switch (kind()) {
    @case ('substance') {
      <app-substance-form
        [substance]="editedSubstance"
        [showTitle]="!chooser"
        (saved)="savedSubstance($event)"
        (cancelled)="cancel()"
      />
    }
    @case ('batch') {
      <app-batch-form
        [batch]="editedBatch"
        [substanceId]="batchSubstanceId"
        [showTitle]="!chooser"
        (saved)="savedBatch($event)"
        (cancelled)="cancel()"
      />
    }
    @case ('consumption') {
      <app-consumption-form
        [consumption]="editedConsumption"
        [substanceId]="data.substanceId ?? null"
        [oneTimeOnly]="data.oneTime ?? false"
        [draft]="data.draft ?? null"
        [showTitle]="!chooser"
        (saved)="savedConsumption($event)"
        (cancelled)="cancel()"
      />
    }
    @case ('user') {
      <app-user-form [user]="editedUser" [showTitle]="!chooser" (saved)="savedUser($event)" (cancelled)="cancel()" />
    }
  }
</mat-dialog-content>
