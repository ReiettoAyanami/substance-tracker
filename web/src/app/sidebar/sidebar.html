<nav aria-label="Pages">
  <p class="app-name">Substance tracker</p>
  @if (session.user(); as user) {
    <p class="username">{{ user.username }}</p>
  }

  <mat-nav-list>
    @for (page of pages; track page.path) {
      <!-- activated: Material's indicator of the current page (and aria-current="page"). -->
      <a
        mat-list-item
        [routerLink]="session.path(page.path)"
        routerLinkActive
        [routerLinkActiveOptions]="page.match"
        #link="routerLinkActive"
        [activated]="link.isActive"
        (click)="navigated.emit()"
      >
        <mat-icon matListItemIcon>{{ page.icon }}</mat-icon>
        <span matListItemTitle>{{ page.label }}</span>
      </a>
    }
  </mat-nav-list>

  <!-- At the bottom, apart from the pages. -->
  <mat-nav-list class="bottom">
    @if (signOutError(); as message) {
      <p class="sign-out-error" role="alert">{{ message }}</p>
    }
    <button mat-list-item type="button" class="sign-out" (click)="signOut()">
      <mat-icon matListItemIcon>logout</mat-icon>
      <span matListItemTitle>Sign out</span>
    </button>
    <a
      mat-list-item
      [routerLink]="session.path('/settings')"
      routerLinkActive
      [routerLinkActiveOptions]="settingsMatch"
      #settings="routerLinkActive"
      [activated]="settings.isActive"
      (click)="navigated.emit()"
    >
      <mat-icon matListItemIcon>settings</mat-icon>
      <span matListItemTitle>Settings</span>
    </a>
  </mat-nav-list>
</nav>
