<mat-expansion-panel class="panel">
  <mat-expansion-panel-header>
    <mat-panel-title>One-time</mat-panel-title>
    <mat-panel-description class="total">{{ total() }}</mat-panel-description>
  </mat-expansion-panel-header>

  <!-- At the top right of the open panel, like "Add batch" in the batch list: there with none too. -->
  <div class="tools">
    <button mat-button type="button" class="add" (click)="add()">
      <mat-icon>add</mat-icon>
      Add one-time
    </button>
  </div>

  <ul class="items">
    @for (row of rows(); track row.item.id) {
      <li class="item">
        <div class="item-title">
          <span class="item-name" [class.unnamed]="!row.item.name">{{ row.item.name ?? 'Unnamed' }}</span>
          <span class="when">{{ row.when }}</span>
        </div>
        <!-- How much or what was paid, a toggle, with the delta pill on the right: like a consumption card. -->
        <app-consumption-figures class="facts" [consumption]="row.item" [quantity]="row.quantity" [price]="row.price" />
        @if (row.item.note) {
          <p class="note">{{ row.item.note }}</p>
        }
      </li>
    }
  </ul>

  @if (hasMore()) {
    <button mat-button type="button" class="more" [disabled]="loadingMore()" (click)="showMore()">
      Show more
    </button>
  }
  @if (moreFailed()) {
    <p class="error" role="alert">Could not load more consumptions</p>
  }
</mat-expansion-panel>
