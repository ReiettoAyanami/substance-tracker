@if (view(); as view) {
  <div class="backdrop" (click)="close()"></div>
  <section
    class="window"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="view.found ? view.substance.name : 'Substance not found'"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
  >
    <button mat-icon-button type="button" class="close" aria-label="Close" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
    @if (view.found) {
      <div class="content">
        <app-substance-card
          [substance]="view.substance"
          [settings]="view.settings"
          (edit)="actions.edit(view.substance)"
          (remove)="delete(view.substance)"
        />
        <app-batch-list
          [substanceId]="view.substance.id"
          [unit]="view.substance.unit"
          [settings]="view.settings"
          (changed)="reload(view.substance.id)"
        />
        <app-one-time-list
          [substanceId]="view.substance.id"
          [unit]="view.substance.unit"
          [settings]="view.settings"
          (changed)="reload(view.substance.id)"
        />
        <!-- The substance as reloaded after a write: its metrics are asked again with it. -->
        <app-metrics-panel
          scope="substance"
          [entityId]="view.substance.id"
          [unit]="view.substance.unit"
          [settings]="view.settings"
          [refresh]="view.substance"
        />
      </div>
      <nav class="pager">
        <button
          mat-icon-button
          type="button"
          class="previous"
          aria-label="Previous substance"
          [disabled]="view.previous === null"
          (click)="go(view.previous!)"
        >
          <mat-icon>chevron_left</mat-icon>
        </button>
        <span class="position">{{ view.position }} / {{ view.count }}</span>
        <button
          mat-icon-button
          type="button"
          class="next"
          aria-label="Next substance"
          [disabled]="view.next === null"
          (click)="go(view.next!)"
        >
          <mat-icon>chevron_right</mat-icon>
        </button>
      </nav>
    } @else {
      <p class="missing">Substance not found</p>
    }
  </section>
}
