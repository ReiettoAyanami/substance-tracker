@if (failure(); as why) {
  <p class="error" role="alert">{{ why }}</p>
} @else if (recent(); as items) {
  @for (item of items; track item.id) {
    <app-consumption-card variant="compact" [deltaOf]="deltaOf()" [consumption]="item" [settings]="settings()" />
  } @empty {
    <p class="empty">No consumptions</p>
  }
  @if (items.length > 0) {
    <!-- The item after the five (lenzi): the way to the consumptions, where they are edited and deleted. -->
    <a
      mat-button
      class="all"
      routerLink="/consumptions"
      [queryParams]="filter()"
      aria-label="All the consumptions of this batch"
    >
      <mat-icon>more_horiz</mat-icon>
    </a>
  }
}
