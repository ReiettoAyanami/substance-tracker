<main class="page">
  <form class="card" [formGroup]="form" (ngSubmit)="signIn()" novalidate>
    <h1 class="app-name">Substance tracker</h1>
    <p class="subtitle">Sign in</p>

    <mat-form-field appearance="outline">
      <mat-label>Username</mat-label>
      <input
        matInput
        formControlName="username"
        autocomplete="username"
        autocapitalize="none"
        autocorrect="off"
        spellcheck="false"
        required
      />
      <mat-error>Enter your username</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input #password matInput formControlName="password" type="password" autocomplete="current-password" required />
      <mat-error>Enter your password</mat-error>
    </mat-form-field>

    @if (error(); as message) {
      <p class="form-error" role="alert">{{ message }}</p>
    }

    <button mat-flat-button type="submit" class="submit" [disabled]="busy()">Sign in</button>

    <p class="hint">Forgot your password? Ask your administrator.</p>
  </form>
</main>
