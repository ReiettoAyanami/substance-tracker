<mat-card appearance="outlined" class="widget">
  <mat-card-header>
    <mat-card-title>{{ definition().label }}</mat-card-title>
    @if (subtitle(); as subtitle) {
      <mat-card-subtitle>{{ subtitle }}</mat-card-subtitle>
    }
  </mat-card-header>
  <mat-card-content>
    @if (scales().length > 1) {
      <mat-button-toggle-group
        class="scales"
        hideSingleSelectionIndicator
        [attr.aria-label]="'Interval of ' + definition().label"
        [value]="scale()"
        (change)="chooseScale($event.value)"
      >
        @for (scale of scales(); track scale) {
          <mat-button-toggle [value]="scale">{{ scale }}</mat-button-toggle>
        }
      </mat-button-toggle-group>
    }
    @if (failure(); as failure) {
      <p class="message">{{ failure }}</p>
    } @else if (series.value(); as data) {
      <app-chart [data]="data" [type]="item().chart ?? 'bar'" [unit]="definition().unit" [settings]="settings()" />
    } @else {
      <p class="message">…</p>
    }
  </mat-card-content>
</mat-card>
