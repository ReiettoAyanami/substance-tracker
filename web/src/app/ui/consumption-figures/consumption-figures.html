@let byQuantity = measure() === 'quantity';
<button
  type="button"
  class="figure"
  [attr.aria-label]="byQuantity ? 'Quantity ' + quantity() + '. Show the price' : 'Price ' + price() + '. Show the quantity'"
  (click)="switchMeasure($event)"
>
  <span class="label">{{ byQuantity ? 'qty: ' : 'price: ' }}</span>
  <span class="value">{{ byQuantity ? quantity() : price() }}</span>
</button>
<!-- The pill's own tap switches the measure here too (two-way); it never reaches the card. -->
<app-delta-pill [consumption]="consumption()" [(measure)]="measure" [short]="true" (click)="$event.stopPropagation()" />
