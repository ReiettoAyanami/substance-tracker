@let byQuantity = measure() === 'quantity';
<span class="figure">
  <!-- The toggle switches the figure and the change; its tap never reaches the card. -->
  <app-measure-toggle [(measure)]="measure" />
  <span class="value">{{ byQuantity ? quantity() : price() }}</span>
</span>
@if (delta(); as shown) {
  <span class="delta" [class.up]="shown.direction === 'up'" [class.down]="shown.direction === 'down'">
    <span class="label">delta:</span>
    <span class="change" [attr.title]="shown.label">
      @if (shown.direction) {
        <mat-icon class="arrow">{{ shown.direction === 'up' ? 'arrow_drop_up' : 'arrow_drop_down' }}</mat-icon>
      }
      <span class="number">{{ shown.change }}</span>
    </span>
  </span>
}
