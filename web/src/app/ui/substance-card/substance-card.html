<mat-card appearance="outlined">
  <mat-card-content>
    <div class="title">
      <span class="dot" [style.background-color]="substance().id | identityColor: 'substance'"></span>
      <!-- The keyboard way in: Enter on the name is a click that reaches the card. -->
      <button type="button" class="name">{{ substance().name }}</button>
      <span class="last-purchase">{{ lastPurchase() }}</span>
      <!-- The menu's tap never opens the page; its items live in an overlay, outside the card. -->
      <button
        mat-icon-button
        type="button"
        class="more"
        [attr.aria-label]="'Actions for ' + substance().name"
        [matMenuTriggerFor]="actions"
        (click)="$event.stopPropagation()"
      >
        <mat-icon>more_vert</mat-icon>
      </button>
    </div>
    <mat-menu #actions="matMenu" xPosition="before">
      <button mat-menu-item type="button" (click)="edit.emit()">
        <mat-icon>edit</mat-icon>
        <span>Edit</span>
      </button>
      <button mat-menu-item type="button" (click)="remove.emit()">
        <mat-icon>delete</mat-icon>
        <span>Delete</span>
      </button>
    </mat-menu>

    @let unitPrice = price() | unitPrice: settings().currency : substance().unit;
    @let byQuantity = measure() === 'quantity';
    <div class="price">
      <!-- The line is its own toggle: price and quantity; its tap never opens the page. -->
      <button
        type="button"
        class="price-value measure"
        [attr.aria-label]="
          byQuantity
            ? 'Quantity left ' + quantity() + '. Show the price per unit'
            : 'Price per unit ' + unitPrice + '. Show the quantity left'
        "
        (click)="switchMeasure($event)"
      >
        <span class="label">{{ byQuantity ? 'qty: ' : 'price: ' }}</span>
        <span class="value">{{ byQuantity ? quantity() : unitPrice }}</span>
      </button>
      <!-- The toggle's tap never opens the page. -->
      <mat-button-toggle-group
        class="price-mode"
        hideSingleSelectionIndicator
        [attr.aria-label]="byQuantity ? 'Quantity left' : 'Price per unit'"
        [value]="mode()"
        (change)="choose($event.value)"
        (click)="$event.stopPropagation()"
      >
        <mat-button-toggle value="last">last</mat-button-toggle>
        <mat-button-toggle value="avg">{{ byQuantity ? 'total' : 'average' }}</mat-button-toggle>
      </mat-button-toggle-group>
    </div>

    <app-stock-bar
      [segments]="substance().summary.stockBarSegments"
      [max]="substance().summary.stockBarMax"
      [only]="only()"
      [label]="stockLabel()"
      [unit]="substance().unit"
      [currency]="settings().currency"
    />
  </mat-card-content>
</mat-card>
