<h2 mat-dialog-title>{{ editing ? 'Edit substance' : 'New substance' }}</h2>

<mat-dialog-content>
  <form id="substance-form" [formGroup]="form" (ngSubmit)="save()">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" autocomplete="off" />
      <mat-error>{{ errorOf('name') }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Unit</mat-label>
      <input matInput formControlName="unit" autocomplete="off" />
      <mat-hint>e.g. g, capsule, bottle</mat-hint>
      <mat-error>{{ errorOf('unit') }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Refill quantity</mat-label>
      <input matInput formControlName="refillQuantity" inputmode="decimal" autocomplete="off" />
      <mat-hint>Optional, e.g. 20 for a pack</mat-hint>
      <mat-error>{{ errorOf('refillQuantity') }}</mat-error>
    </mat-form-field>
  </form>
  @if (formError(); as message) {
    <p class="form-error" role="alert">{{ message }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button type="submit" form="substance-form" [disabled]="saving()">Save</button>
</mat-dialog-actions>
