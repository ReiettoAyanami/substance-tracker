<h2 mat-dialog-title>Delete “{{ substance.name }}”?</h2>

<mat-dialog-content>
  <p>Its batches and consumptions are deleted too.</p>
  @if (error(); as message) {
    <p class="error" role="alert">{{ message }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button type="button" class="delete" [disabled]="deleting()" (click)="confirm()">Delete</button>
</mat-dialog-actions>
