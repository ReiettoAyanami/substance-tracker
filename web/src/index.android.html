<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The Android app's own CSP (design-android.md, "bundled assets"): its pages come from inside the
      APK and never receive the server's headers (api/src/shared/security-headers.ts). The website's
      rules, without Google Fonts (the fonts are bundled) and without frame-ancestors, which a <meta>
      cannot carry and the app does not need.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>Substance tracker</title>
    <base href="/" />
    <!--
      Edge to edge (B3): viewport-fit=cover lets the pages reach under the status and gesture bars
      (Capacitor's SystemBars passes the bars' insets on to the WebView, capacitor.config.ts), so the
      scrims cover them too; what must stay readable keeps away from them by
      env(safe-area-inset-*). The website's index.html has no cover: there the insets are 0.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
