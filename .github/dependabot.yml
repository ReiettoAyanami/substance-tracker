# Security patches for every instance's image (design-accounts.md, "Releases"): weekly, the minor
# and patch updates of each package grouped in one pull request. Dependabot reads this file from the
# repository's default branch (main since 2026-10-05), and its pull requests go to `dev`, the branch
# every change starts from and comes back to (lenzi, 2026-10-05): main holds only final versions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The Node base image of the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    target-branch: dev

  # The actions of the CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      actions:
        update-types: [minor, patch]
