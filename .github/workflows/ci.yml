# CI (design-accounts.md, "Releases"; design-android.md, "Release pipeline"): the version rules, the
# API's and the web's tests, npm audit, the Android APK and the image built on every push, and
# published (the image to the GitHub Container Registry, the APK with a GitHub Release) only from
# main with a final version (a alpha, b beta, v release; lenzi, 2026-10-03).
name: CI

on:
  push:
    branches: [main, 'dev*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version rules
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: The version of this commit, and the rules of its branch
        run: |
          version=$(sed -n "s/^export const VERSION = '\(.*\)';$/\1/p" api/src/version.ts)
          level=$(sed -n "s/^export const API_LEVEL = \([0-9]*\);$/\1/p" api/src/version.ts)
          # The pages carry a copy, for the Android app (web/src/app/app-version.ts): the same, always.
          app_version=$(sed -n "s/^export const APP_VERSION = '\(.*\)';$/\1/p" web/src/app/app-version.ts)
          app_level=$(sed -n "s/^export const APP_API_LEVEL = \([0-9]*\);$/\1/p" web/src/app/app-version.ts)
          if [ "$app_version" != "$version" ] || [ "$app_level" != "$level" ]; then
            echo "::error::web/src/app/app-version.ts ($app_version, level $app_level) must say what api/src/version.ts says ($version, level $level)"; exit 1
          fi
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "version $version on $branch"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$branch" in
            main)
              # Final versions only, numbers only: a26.0.0, b26.1.0, v26.1.2.
              [[ "$version" =~ ^[abv][0-9]{2}\.[0-9]+\.[0-9]+$ ]] || { echo "::error::on main the version is a, b or v with numbers only, not $version"; exit 1; } ;;
            dev)
              # The integration branch: every change starts from it and comes back to it; it carries
              # the version of the last branch merged into it (lenzi, 2026-10-05).
              [[ "$version" =~ ^dev[0-9]{2}\.[0-9]+\.[0-9]+(-[a-z0-9]+(-[a-z0-9]+)*)?$ ]] || { echo "::error::on dev the version is a dev version, not $version"; exit 1; } ;;
            dev*)
              # A branch of work, from dev, is named after its new version (dev26.0.1, dev26.0.1-squircle).
              [ "$version" = "$branch" ] || { echo "::error::the branch $branch carries version $version: they must be the same"; exit 1; } ;;
          esac

  api:
    name: API tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: substance_tracker_test
          MYSQL_USER: substance
          MYSQL_PASSWORD: ci-password
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-root --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: substance_tracker
      TEST_DB_NAME: substance_tracker_test
      DB_USER: substance
      DB_PASSWORD: ci-password
      APP_URL: http://localhost:4200
      COOKIE_PREFIX: substance-tracker-ci
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # What ships in the image: the API's production dependencies and the web's (built into static
      # files). A high or critical advisory there fails the build.
      - name: Production dependencies (blocking)
        run: |
          (cd api && npm audit --omit=dev --audit-level=high)
          (cd web && npm audit --omit=dev --audit-level=high)
      # The build tools (Angular CLI and builder, test runner) never reach the image: their advisories
      # are shown here, Dependabot proposes the updates.
      - name: Build tools (shown, not blocking)
        continue-on-error: true
        run: |
          (cd api && npm audit --audit-level=high)
          (cd web && npm audit --audit-level=high)

  apk:
    name: Android APK
    needs: [version, web]
    runs-on: ubuntu-latest
    env:
      NG_CLI_ANALYTICS: 'false'
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Capacitor 8 builds with Java 21; the runner already has the Android SDK (ANDROID_HOME).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: The app build, copied into the Android project
        run: |
          npx ng build --configuration production,android
          npx cap sync android
      - id: code
        name: The version code, which must always grow (design-android.md, "Release pipeline")
        run: |
          stage="${VERSION%%[0-9]*}"
          numbers="${VERSION#"$stage"}"; numbers="${numbers%%-*}"
          IFS=. read -r year backend frontend <<< "$numbers"
          case "$stage" in a) s=1 ;; b) s=2 ;; v) s=3 ;; *) s=0 ;; esac
          if [ "$backend" -ge 100 ] || [ "$frontend" -ge 100 ]; then
            echo "::error::$VERSION: the backend and frontend numbers must stay below 100 for the version code"; exit 1
          fi
          code=$(( 10#$year * 1000000 + backend * 10000 + frontend * 100 + s ))
          echo "$VERSION -> version code $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # The release key from the secrets, only for a final version on main. Anywhere else (a dev
      # branch, a pull request) the APK is a dry run, signed with a key made here and thrown away:
      # installable to try it, never published.
      - name: The signing key
        env:
          RELEASE: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keystore="$RUNNER_TEMP/signing.p12"
          if [ "$RELEASE" = true ]; then
            [ -n "$KEYSTORE_BASE64" ] || { echo "::error::a release needs the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets"; exit 1; }
            echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            password="$KEYSTORE_PASSWORD"; alias="$KEY_ALIAS"
          else
            password="$(openssl rand -hex 24)"; alias=dry-run
            echo "::add-mask::$password"
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 -storepass "$password" -alias "$alias"               -keyalg RSA -keysize 2048 -validity 30 -dname "CN=substance-tracker dry run" >/dev/null 2>&1
          fi
          { echo "ANDROID_KEYSTORE=$keystore"; echo "ANDROID_KEYSTORE_PASSWORD=$password"; echo "ANDROID_KEY_ALIAS=$alias"; } >> "$GITHUB_ENV"
      - name: The release APK
        working-directory: web/android
        run: |
          start=$(date +%s)
          ./gradlew --no-daemon assembleProdRelease -PappVersionName="$VERSION" -PappVersionCode="${{ steps.code.outputs.code }}"
          apk=app/build/outputs/apk/prod/release/app-prod-release.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$apk" | head -3
          cp "$apk" "$RUNNER_TEMP/substance.apk"
          echo "built in $(( $(date +%s) - start )) s, $(du -h "$RUNNER_TEMP/substance.apk" | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: substance-apk
          path: ${{ runner.temp }}/substance.apk
          retention-days: 30

  image:
    name: Image
    needs: [version, api, web, audit, apk]
    runs-on: ubuntu-latest
    permissions:
      # contents: write for the GitHub Release of a published version, with its APK.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The APK of this commit into apk/, which the image copies and serves at /download/substance.apk.
      - uses: actions/download-artifact@v4
        with:
          name: substance-apk
          path: apk
      - id: target
        name: Published only from main, with a final version never published before
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          publish=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" = main ]; then
            if docker buildx imagetools inspect "$image:$VERSION" >/dev/null 2>&1; then
              echo "::warning::$image:$VERSION is already published: this commit is not (a version is never overwritten; lenzi decides the next one)"
            else
              publish=true
            fi
          fi
          tags="$image:$VERSION"
          # A release is also the image that `latest` points to.
          [[ "$VERSION" == v* ]] && tags="$tags,$image:latest"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - if: steps.target.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Built on every push (the Dockerfile must keep working); pushed only when published. amd64 for
      # now: arm64 (a Raspberry Pi) waits for lenzi's answer.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.target.outputs.publish == 'true' }}
          tags: ${{ steps.target.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The GitHub Release of a published version, with the same APK the image carries: where the
      # APK comes from for an instance built without the CI (design-android.md, "/download").
      - if: steps.target.outputs.publish == 'true'
        name: GitHub Release with the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          prerelease=""
          [[ "$VERSION" == v* ]] || prerelease="--prerelease"
          gh release create "$VERSION" apk/substance.apk --target "$GITHUB_SHA" --title "$VERSION" $prerelease             --notes "Image: ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION. Android app: substance.apk (also at /download on an instance of this version)."
